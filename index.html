<style>
/* Layout: one centred phone-width column — monogram bar, offset-disc portrait, sage contact pills, clay save button */
:root {
  --charcoal: #2C3639;
  --charcoal-2: #354145;
  --ivory: #F9F6EE;
  --sage: #DCD7C9;
  --sage-ink: #4A5457;
  --muted: #B9B4A7;
  --clay: #A27B5C;
  --clay-light: #E2C6AE;
  --font: "Outfit", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme: dark;
}
html { background: var(--charcoal); }
body {
  margin: 0;
  box-sizing: border-box;
  background: var(--charcoal);
  color: var(--ivory);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
  min-height: 100vh;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 28px;
  -webkit-font-smoothing: antialiased;
}
.card { max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; gap: 26px; }

.topbar { display: flex; justify-content: space-between; align-items: center; }
.mono {
  width: 38px; height: 38px; border-radius: 50%;
  border: 1.5px solid var(--sage);
  display: flex; align-items: center; justify-content: center;
  font-weight: 600; font-size: 13px; letter-spacing: 0.05em; color: var(--sage);
}
.loc { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); letter-spacing: 0.03em; }
.loc svg { width: 14px; height: 14px; stroke: var(--clay-light); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.head { display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; }
.portrait { position: relative; width: 168px; height: 168px; }
.portrait::before {
  content: ""; position: absolute; top: 12px; left: 16px;
  width: 160px; height: 160px; border-radius: 50%; background: var(--clay);
}
.portrait img {
  position: relative; display: block;
  width: 160px; height: 160px; border-radius: 50%;
  object-fit: cover; object-position: 50% 30%;
  border: 4px solid var(--sage); box-sizing: border-box; background: var(--ivory);
}
h1 { margin: 0; font-weight: 600; font-size: clamp(2.25rem, 9vw, 2.6rem); line-height: 1.05; letter-spacing: -0.01em; }
.role { margin: 0; font-size: 1rem; line-height: 1.45; color: var(--sage); max-width: 30ch; text-wrap: balance; }
.chip {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 14px; border-radius: 999px;
  border: 1px solid var(--clay); color: var(--clay-light);
  font-size: 0.9rem; line-height: 1.3; text-align: left;
}
.chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--clay); flex: none; }

.pills { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.pill {
  display: flex; align-items: center; gap: 4px;
  min-height: 60px; padding: 0 6px 0 7px;
  border-radius: 999px; background: var(--sage); color: var(--charcoal);
}
.pill a {
  flex: 1; min-width: 0;
  display: flex; align-items: center; gap: 12px;
  color: var(--charcoal); text-decoration: none;
  font-weight: 500; font-size: 1rem;
  border-radius: 999px;
}
.pill .val { min-width: 0; overflow-wrap: anywhere; user-select: all; -webkit-user-select: all; }
.badge {
  width: 46px; height: 46px; border-radius: 50%; flex: none;
  background: var(--charcoal); display: flex; align-items: center; justify-content: center;
  transition: transform .15s ease;
}
.badge svg { width: 19px; height: 19px; stroke: var(--sage); fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.pill a:hover .badge { transform: scale(1.06); }
.end {
  width: 46px; height: 46px; flex: none; border: 0; border-radius: 50%;
  background: transparent; color: var(--sage-ink);
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  transition: background .15s ease;
}
.end svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
button.end:hover { background: rgba(44,54,57,0.08); }
.end.done { background: var(--charcoal); color: var(--sage); }

.save {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; min-height: 60px; border: 0; border-radius: 999px;
  background: var(--clay); color: var(--ivory);
  font: 700 1.2rem var(--font); cursor: pointer;
  box-shadow: 0 14px 30px -16px rgba(0,0,0,0.6);
  transition: filter .15s ease, transform .15s ease;
}
.save svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.save:hover { filter: brightness(1.07); transform: translateY(-1px); }
.hint { margin: -14px 0 0; text-align: center; font-size: 0.85rem; color: var(--muted); }

.foot { display: flex; justify-content: center; font-size: 0.75rem; color: var(--muted); letter-spacing: 0.04em; opacity: 0.8; }

.pill a:focus-visible, .end:focus-visible, .save:focus-visible { outline: 2px solid var(--clay-light); outline-offset: 3px; }

.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 8px); opacity: 0; pointer-events: none;
  background: var(--ivory); color: var(--charcoal);
  padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: 0.9rem;
  box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
  transition: opacity .2s ease, transform .2s ease;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: no-preference) {
  .head, .pills, .save { animation: rise .5s ease both; }
  .pills { animation-delay: .08s; }
  .save { animation-delay: .14s; }
  @keyframes rise { from { transform: translateY(8px); } to { transform: none; } }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
@media (max-width: 350px) {
  .portrait, .portrait img, .portrait::before { width: 136px; height: 136px; }
  .pill a { font-size: 0.92rem; }
}
</style>

  var toastEl = document.getElementById("toast");
  var toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 1800);
  }

  document.getElementById("save").addEventListener("click", function () {
    var blob = new Blob([VCARD], { type: "text/vcard;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "James-Lee.vcf";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  });

  function selectText(el) {
    try {
      var r = document.createRange();
      r.selectNodeContents(el);
      var s = window.getSelection();
      s.removeAllRanges();
      s.addRange(r);
    } catch (e) {}
  }

  document.querySelectorAll(".copy").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var text = btn.getAttribute("data-copy");
      var what = btn.getAttribute("data-what");
      var done = function () {
        btn.classList.add("done");
        toast(what + " copied");
        setTimeout(function () { btn.classList.remove("done"); }, 1500);
      };
      var fallback = function () {
        var v = btn.parentElement.querySelector(".val");
        if (v) selectText(v);
        toast(what + " selected, tap Copy");
      };
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done, fallback);
        } else { fallback(); }
      } catch (e) { fallback(); }
    });
  });
})();
